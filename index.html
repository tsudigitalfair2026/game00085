<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,user-scalable=0">
<title>くるまシューティング</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}
html,body{
width:100%;
height:100%;
overflow:hidden;
touch-action:none;
font-family:sans-serif;
background:#111;
color:#fff;
}
.screen{
display:none;
width:100%;
height:100%;
padding:20px;
}
.screen.active{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}
h1{
margin-bottom:20px;
font-size:2rem;
text-align:center;
}
p{
text-align:center;
line-height:1.7;
}
button{
padding:16px 28px;
font-size:1.2rem;
border:none;
border-radius:14px;
background:#00aaff;
color:#fff;
min-width:180px;
margin-top:20px;
}
#gameScreen{
padding:0;
justify-content:flex-start;
}
#hud{
width:100%;
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
background:#222;
font-weight:bold;
font-size:0.95rem;
}
#gameArea{
position:relative;
width:100%;
flex:1;
overflow:hidden;
background:linear-gradient(#6ec6ff,#dff5ff);
touch-action:none;
}
#player{
position:absolute;
font-size:48px;
bottom:15px;
left:50%;
transform:translateX(-50%);
}
.enemy{
position:absolute;
font-size:38px;
}
.rocket{
position:absolute;
font-size:44px;
}
.rainbow{
position:absolute;
font-size:42px;
}
.bullet{
position:absolute;
font-size:22px;
}
#rank{
font-size:2rem;
margin-top:15px;
color:gold;
}
#power{
color:#ffeb3b;
}
.info{
max-width:500px;
}
</style>
</head>
<body>

<div id="startScreen" class="screen active">
<h1>🚗 くるまシューティング</h1>
<p class="info">
左右に車を動かして敵を撃とう！<br>
🌈虹色の特別カーで10秒間得点2倍！<br>
🚀ロケット車は超高速で突っ込んでくる！<br>
60秒で高得点を目指そう！
</p>
<button id="startBtn">スタート</button>
</div>

<div id="gameScreen" class="screen">
<div id="hud">
<div>スコア:<span id="score">0</span></div>
<div>残り:<span id="time">60</span>秒</div>
<div id="power">×1</div>
</div>
<div id="gameArea">
<div id="player">🚗</div>
</div>
</div>

<div id="resultScreen" class="screen">
<h1>結果発表</h1>
<p>最終スコア</p>
<h2 id="finalScore">0</h2>
<div id="rank">C</div>
<button id="restartBtn">もう一度遊ぶ</button>
</div>

<script>
const startScreen=document.getElementById("startScreen");
const gameScreen=document.getElementById("gameScreen");
const resultScreen=document.getElementById("resultScreen");

const gameArea=document.getElementById("gameArea");
const player=document.getElementById("player");

const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");
const finalScoreEl=document.getElementById("finalScore");
const rankEl=document.getElementById("rank");
const powerEl=document.getElementById("power");

let score=0;
let timeLeft=60;
let playerX=0;
let gameRunning=false;

let bullets=[];
let enemies=[];
let rainbows=[];
let rockets=[];

let scoreMultiplier=1;
let multiplierTimer=0;

let timerInterval;
let enemyInterval;
let rainbowInterval;
let rocketInterval;
let shotInterval;
let gameLoopId;

function showScreen(screen){
[startScreen,gameScreen,resultScreen].forEach(s=>s.classList.remove("active"));
screen.classList.add("active");
}

function startGame(){

score=0;
timeLeft=60;
scoreMultiplier=1;
multiplierTimer=0;

scoreEl.textContent=0;
timeEl.textContent=60;
powerEl.textContent="×1";

[...bullets,...enemies,...rainbows,...rockets].forEach(v=>{
if(v.el) v.el.remove();
});

bullets=[];
enemies=[];
rainbows=[];
rockets=[];

showScreen(gameScreen);

gameRunning=true;

playerX=(gameArea.clientWidth/2)-24;
player.style.left=playerX+"px";

timerInterval=setInterval(()=>{
timeLeft--;
timeEl.textContent=timeLeft;

if(multiplierTimer>0){
multiplierTimer--;
if(multiplierTimer<=0){
scoreMultiplier=1;
powerEl.textContent="×1";
}
}

if(timeLeft<=0){
endGame();
}
},1000);

enemyInterval=setInterval(spawnEnemy,800);
rainbowInterval=setInterval(spawnRainbow,12000);
rocketInterval=setInterval(spawnRocket,5000);

shotInterval=setInterval(()=>{
if(gameRunning) shoot();
},250);

gameLoop();
}

function spawnEnemy(){
const el=document.createElement("div");
el.className="enemy";
el.textContent="🚙";

const x=Math.random()*(gameArea.clientWidth-40);

el.style.left=x+"px";
el.style.top="-50px";

gameArea.appendChild(el);

enemies.push({
el,x,y:-50,speed:2+Math.random()*2
});
}

function spawnRocket(){
const el=document.createElement("div");
el.className="rocket";
el.textContent="🚀";

const x=Math.random()*(gameArea.clientWidth-50);

el.style.left=x+"px";
el.style.top="-60px";

gameArea.appendChild(el);

rockets.push({
el,x,y:-60,speed:8+Math.random()*3
});
}

function spawnRainbow(){
const el=document.createElement("div");
el.className="rainbow";
el.textContent="🌈";

const x=Math.random()*(gameArea.clientWidth-50);

el.style.left=x+"px";
el.style.top="-50px";

gameArea.appendChild(el);

rainbows.push({
el,x,y:-50,speed:3
});
}

function shoot(){
const el=document.createElement("div");
el.className="bullet";
el.textContent="💥";

const x=playerX+12;
const y=gameArea.clientHeight-90;

el.style.left=x+"px";
el.style.top=y+"px";

gameArea.appendChild(el);

bullets.push({
el,x,y
});
}

function gameLoop(){

if(!gameRunning) return;

for(let i=bullets.length-1;i>=0;i--){
const b=bullets[i];
b.y-=8;
b.el.style.top=b.y+"px";

if(b.y<-40){
b.el.remove();
bullets.splice(i,1);
}
}

for(let i=rainbows.length-1;i>=0;i--){
const r=rainbows[i];
r.y+=r.speed;
r.el.style.top=r.y+"px";

if(
Math.abs((playerX+24)-r.x)<45 &&
Math.abs((gameArea.clientHeight-50)-r.y)<60
){
scoreMultiplier=2;
multiplierTimer=10;
powerEl.textContent="🌈×2";
r.el.remove();
rainbows.splice(i,1);
continue;
}

if(r.y>gameArea.clientHeight){
r.el.remove();
rainbows.splice(i,1);
}
}

for(let i=rockets.length-1;i>=0;i--){
const r=rockets[i];

r.y+=r.speed;
r.el.style.top=r.y+"px";

if(
Math.abs((playerX+24)-r.x)<40 &&
Math.abs((gameArea.clientHeight-60)-r.y)<55
){
score=Math.max(0,score-30);
scoreEl.textContent=score;

r.el.remove();
rockets.splice(i,1);
continue;
}

for(let j=bullets.length-1;j>=0;j--){
const b=bullets[j];

if(
Math.abs(b.x-r.x)<35 &&
Math.abs(b.y-r.y)<35
){
score+=30*scoreMultiplier;
scoreEl.textContent=score;

b.el.remove();
r.el.remove();

bullets.splice(j,1);
rockets.splice(i,1);
break;
}
}

if(r && r.y>gameArea.clientHeight){
if(r.el) r.el.remove();
rockets.splice(i,1);
}
}

for(let i=enemies.length-1;i>=0;i--){
const e=enemies[i];

e.y+=e.speed;
e.el.style.top=e.y+"px";

if(e.y>gameArea.clientHeight){
e.el.remove();
enemies.splice(i,1);
score=Math.max(0,score-5);
scoreEl.textContent=score;
continue;
}

for(let j=bullets.length-1;j>=0;j--){
const b=bullets[j];

if(
Math.abs(b.x-e.x)<35 &&
Math.abs(b.y-e.y)<35
){
score+=10*scoreMultiplier;
scoreEl.textContent=score;

e.el.remove();
b.el.remove();

enemies.splice(i,1);
bullets.splice(j,1);
break;
}
}
}

gameLoopId=requestAnimationFrame(gameLoop);
}

function endGame(){

gameRunning=false;

clearInterval(timerInterval);
clearInterval(enemyInterval);
clearInterval(rainbowInterval);
clearInterval(rocketInterval);
clearInterval(shotInterval);

cancelAnimationFrame(gameLoopId);

finalScoreEl.textContent=score;

let rank="C";

if(score>=900){
rank="S";
}else if(score>=600){
rank="A";
}else if(score>=350){
rank="B";
}

rankEl.textContent="ランク "+rank;

showScreen(resultScreen);
}

function movePlayer(clientX){

const rect=gameArea.getBoundingClientRect();

playerX=clientX-rect.left-24;

if(playerX<0) playerX=0;
if(playerX>gameArea.clientWidth-48){
playerX=gameArea.clientWidth-48;
}

player.style.left=playerX+"px";
}

gameArea.addEventListener("touchstart",e=>{
if(gameRunning){
movePlayer(e.touches[0].clientX);
}
},{passive:false});

gameArea.addEventListener("touchmove",e=>{
if(!gameRunning) return;
e.preventDefault();
movePlayer(e.touches[0].clientX);
},{passive:false});

gameArea.addEventListener("mousedown",e=>{
if(!gameRunning) return;

movePlayer(e.clientX);

function move(ev){
movePlayer(ev.clientX);
}

function up(){
document.removeEventListener("mousemove",move);
document.removeEventListener("mouseup",up);
}

document.addEventListener("mousemove",move);
document.addEventListener("mouseup",up);
});

document.getElementById("startBtn").addEventListener("click",startGame);
document.getElementById("restartBtn").addEventListener("click",startGame);
</script>

</body>
</html>
